<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How split(",") cuts a string into a list</title>

  <!-- code label -->
  <text id="code-label" x="400" y="40" text-anchor="middle" font-size="24" fill="#eee8d5">"red,green,blue".split(",")</text>

  <!-- string cells: 14 characters, 44px each, starting at x=92 -->
  <g id="string-cells" font-size="26" text-anchor="middle">
    <!-- group 1: red -->
    <rect x="92"  y="70" width="44" height="50" fill="#268bd2" fill-opacity="0.25" stroke="#268bd2" stroke-width="2"/>
    <rect x="136" y="70" width="44" height="50" fill="#268bd2" fill-opacity="0.25" stroke="#268bd2" stroke-width="2"/>
    <rect x="180" y="70" width="44" height="50" fill="#268bd2" fill-opacity="0.25" stroke="#268bd2" stroke-width="2"/>
    <text x="114" y="104" fill="#fdf6e3">r</text>
    <text x="158" y="104" fill="#fdf6e3">e</text>
    <text x="202" y="104" fill="#fdf6e3">d</text>

    <!-- separator 1 -->
    <rect x="224" y="70" width="44" height="50" fill="#cb4b16" fill-opacity="0.45" stroke="#cb4b16" stroke-width="2"/>
    <text x="246" y="104" fill="#fdf6e3">,</text>

    <!-- group 2: green -->
    <rect x="268" y="70" width="44" height="50" fill="#859900" fill-opacity="0.25" stroke="#859900" stroke-width="2"/>
    <rect x="312" y="70" width="44" height="50" fill="#859900" fill-opacity="0.25" stroke="#859900" stroke-width="2"/>
    <rect x="356" y="70" width="44" height="50" fill="#859900" fill-opacity="0.25" stroke="#859900" stroke-width="2"/>
    <rect x="400" y="70" width="44" height="50" fill="#859900" fill-opacity="0.25" stroke="#859900" stroke-width="2"/>
    <rect x="444" y="70" width="44" height="50" fill="#859900" fill-opacity="0.25" stroke="#859900" stroke-width="2"/>
    <text x="290" y="104" fill="#fdf6e3">g</text>
    <text x="334" y="104" fill="#fdf6e3">r</text>
    <text x="378" y="104" fill="#fdf6e3">e</text>
    <text x="422" y="104" fill="#fdf6e3">e</text>
    <text x="466" y="104" fill="#fdf6e3">n</text>

    <!-- separator 2 -->
    <rect x="488" y="70" width="44" height="50" fill="#cb4b16" fill-opacity="0.45" stroke="#cb4b16" stroke-width="2"/>
    <text x="510" y="104" fill="#fdf6e3">,</text>

    <!-- group 3: blue -->
    <rect x="532" y="70" width="44" height="50" fill="#b58900" fill-opacity="0.25" stroke="#b58900" stroke-width="2"/>
    <rect x="576" y="70" width="44" height="50" fill="#b58900" fill-opacity="0.25" stroke="#b58900" stroke-width="2"/>
    <rect x="620" y="70" width="44" height="50" fill="#b58900" fill-opacity="0.25" stroke="#b58900" stroke-width="2"/>
    <rect x="664" y="70" width="44" height="50" fill="#b58900" fill-opacity="0.25" stroke="#b58900" stroke-width="2"/>
    <text x="554" y="104" fill="#fdf6e3">b</text>
    <text x="598" y="104" fill="#fdf6e3">l</text>
    <text x="642" y="104" fill="#fdf6e3">u</text>
    <text x="686" y="104" fill="#fdf6e3">e</text>
  </g>

  <!-- cut marks through the separators -->
  <g id="cuts" stroke="#cb4b16" stroke-width="2.5" stroke-dasharray="6 5">
    <line x1="246" y1="58" x2="246" y2="136"/>
    <line x1="510" y1="58" x2="510" y2="136"/>
  </g>
  <g id="cut-labels" font-size="15" fill="#cb4b16" text-anchor="middle">
    <text x="246" y="152">cut</text>
    <text x="510" y="152">cut</text>
  </g>

  <!-- arrows from groups to list items -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93a1a1"/>
    </marker>
  </defs>
  <g id="arrows" stroke="#93a1a1" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="158" y1="128" x2="158" y2="214" marker-end="url(#arrow)"/>
    <line x1="378" y1="128" x2="378" y2="214" marker-end="url(#arrow)"/>
    <line x1="620" y1="128" x2="620" y2="214" marker-end="url(#arrow)"/>
  </g>

  <!-- resulting list -->
  <g id="result-list" font-size="24" text-anchor="middle">
    <text x="70"  y="262" font-size="30" fill="#eee8d5">[</text>
    <rect x="98"  y="230" width="120" height="48" rx="6" fill="#268bd2" fill-opacity="0.25" stroke="#268bd2" stroke-width="2"/>
    <text x="158" y="262" fill="#fdf6e3">'red'</text>
    <rect x="318" y="230" width="120" height="48" rx="6" fill="#859900" fill-opacity="0.25" stroke="#859900" stroke-width="2"/>
    <text x="378" y="262" fill="#fdf6e3">'green'</text>
    <rect x="560" y="230" width="120" height="48" rx="6" fill="#b58900" fill-opacity="0.25" stroke="#b58900" stroke-width="2"/>
    <text x="620" y="262" fill="#fdf6e3">'blue'</text>
    <text x="730" y="262" font-size="30" fill="#eee8d5">]</text>
  </g>

  <!-- caption -->
  <text id="caption" x="400" y="316" text-anchor="middle" font-size="16" fill="#93a1a1">the separator is consumed: it does not appear in the result</text>
</svg>
