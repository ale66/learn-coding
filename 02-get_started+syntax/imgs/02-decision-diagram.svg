<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A decision diagram: cover the tomatoes if the temperature is above the limit</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#93a1a1"/>
    </marker>
  </defs>
  <!-- start -->
  <rect x="290" y="15" width="180" height="46" rx="23" fill="#eee8d5" stroke="#073642" stroke-width="2"/>
  <text x="380" y="44" font-size="18" text-anchor="middle" fill="#073642">Read today's temp.</text>
  <line x1="380" y1="61" x2="380" y2="100" stroke="#93a1a1" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- diamond -->
  <polygon points="380,100 500,180 380,260 260,180" fill="#b58900" stroke="#073642" stroke-width="2.5"/>
  <text x="380" y="175" font-size="19" text-anchor="middle" fill="#073642" font-family="monospace">temp &gt;</text>
  <text x="380" y="197" font-size="19" text-anchor="middle" fill="#073642" font-family="monospace">LIMIT ?</text>

  <!-- yes branch -->
  <line x1="500" y1="180" x2="600" y2="180" stroke="#93a1a1" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="550" y="165" font-size="17" fill="#2aa198" font-weight="bold" text-anchor="middle">Yes</text>
  <rect x="600" y="155" width="150" height="50" rx="10" fill="#2aa198" stroke="#073642" stroke-width="2"/>
  <text x="675" y="186" font-size="16" text-anchor="middle" fill="#fdf6e3">Cover tomatoes</text>

  <!-- no branch -->
  <line x1="260" y1="180" x2="160" y2="180" stroke="#93a1a1" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="210" y="165" font-size="17" fill="#cb4b16" font-weight="bold" text-anchor="middle">No</text>
  <rect x="10" y="155" width="150" height="50" rx="10" fill="#cb4b16" stroke="#073642" stroke-width="2"/>
  <text x="85" y="186" font-size="16" text-anchor="middle" fill="#fdf6e3">Uncover tomatoes</text>

  <!-- merge to end -->
  <line x1="675" y1="205" x2="675" y2="330" stroke="#93a1a1" stroke-width="2.5"/>
  <line x1="85" y1="205" x2="85" y2="330" stroke="#93a1a1" stroke-width="2.5"/>
  <line x1="85" y1="330" x2="675" y2="330" stroke="#93a1a1" stroke-width="2.5"/>
  <line x1="380" y1="330" x2="380" y2="360" stroke="#93a1a1" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="290" y="360" width="180" height="46" rx="23" fill="#eee8d5" stroke="#073642" stroke-width="2"/>
  <text x="380" y="389" font-size="18" text-anchor="middle" fill="#073642">Continue program</text>
</svg>
