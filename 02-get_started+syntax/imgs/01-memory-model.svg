<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A variable is a name bound to a value in memory; rebinding moves the name, not the old value</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#93a1a1"/>
    </marker>
  </defs>
  <!-- three snapshots -->
  <g id="snap1">
    <text x="140" y="30" font-size="19" fill="#eee8d5" text-anchor="middle" font-weight="bold">myvar = 10</text>
    <rect x="90" y="50" width="100" height="40" rx="8" fill="#b58900" stroke="#073642" stroke-width="2"/>
    <text x="140" y="75" font-family="monospace" font-size="18" fill="#073642" text-anchor="middle">myvar</text>
    <path d="M140 90 C140 120, 140 120, 140 150" stroke="#93a1a1" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <circle cx="140" cy="190" r="34" fill="#268bd2" stroke="#073642" stroke-width="2"/>
    <text x="140" y="197" font-family="monospace" font-size="20" fill="#fdf6e3" text-anchor="middle">10</text>
  </g>
  <line x1="290" y1="150" x2="330" y2="150" stroke="#93a1a1" stroke-width="3" marker-end="url(#arr)"/>
  <text x="310" y="130" font-size="16" fill="#93a1a1" text-anchor="middle" font-style="italic">myvar = 20</text>

  <g id="snap2">
    <text x="490" y="30" font-size="19" fill="#eee8d5" text-anchor="middle" font-weight="bold">myvar = 20</text>
    <rect x="440" y="50" width="100" height="40" rx="8" fill="#b58900" stroke="#073642" stroke-width="2"/>
    <text x="490" y="75" font-family="monospace" font-size="18" fill="#073642" text-anchor="middle">myvar</text>
    <path d="M490 90 C490 120, 490 120, 490 150" stroke="#93a1a1" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <circle cx="490" cy="190" r="34" fill="#2aa198" stroke="#073642" stroke-width="2"/>
    <text x="490" y="197" font-family="monospace" font-size="20" fill="#fdf6e3" text-anchor="middle">20</text>
    <circle cx="580" cy="190" r="28" fill="none" stroke="#586e75" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="580" y="197" font-family="monospace" font-size="17" fill="#586e75" text-anchor="middle">10</text>
    <text x="580" y="235" font-size="13" fill="#586e75" text-anchor="middle">unreachable</text>
  </g>
  <line x1="640" y1="150" x2="680" y2="150" stroke="#93a1a1" stroke-width="3" marker-end="url(#arr)"/>
  <text x="660" y="130" font-size="16" fill="#93a1a1" text-anchor="middle" font-style="italic">myvar = myvar+1</text>

  <g id="snap3">
    <text x="870" y="30" font-size="19" fill="#eee8d5" text-anchor="middle" font-weight="bold">myvar = 21</text>
    <rect x="820" y="50" width="100" height="40" rx="8" fill="#b58900" stroke="#073642" stroke-width="2"/>
    <text x="870" y="75" font-family="monospace" font-size="18" fill="#073642" text-anchor="middle">myvar</text>
    <path d="M870 90 C870 120, 870 120, 870 150" stroke="#93a1a1" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <circle cx="870" cy="190" r="34" fill="#cb4b16" stroke="#073642" stroke-width="2"/>
    <text x="870" y="197" font-family="monospace" font-size="20" fill="#fdf6e3" text-anchor="middle">21</text>
    <circle cx="960" cy="190" r="26" fill="none" stroke="#586e75" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="960" y="196" font-family="monospace" font-size="15" fill="#586e75" text-anchor="middle">20</text>
  </g>
  <text x="540" y="280" font-size="17" fill="#93a1a1" text-anchor="middle">The name moves to a new value; it does not change the old one</text>
</svg>
